name: ${COMPOSE_PROJECT_NAME:-venom-minimal}

# Security policy (MVP):
# This profile is intended for trusted/private networks only.
# Services are published on host interfaces to allow testing from another machine in LAN.
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8}
    container_name: ${VENOM_CONTAINER_PREFIX:-venom}-ollama-minimal
    ports:
      - "${VENOM_OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-0.0.0.0}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-256}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-10m}
      OLLAMA_NO_CLOUD: ${OLLAMA_NO_CLOUD:-1}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # Avoid curl/wget dependency: ollama image may not include them.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: ${VENOM_CONTAINER_PREFIX:-venom}-backend-minimal
    environment:
      VENOM_RUNTIME_PROFILE: ${VENOM_RUNTIME_PROFILE:-light}
      ENV: production
      ENVIRONMENT_ROLE: ${ENVIRONMENT_ROLE:-dev}
      DB_SCHEMA: ${DB_SCHEMA:-dev}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-venom}
      QUEUE_NAMESPACE: ${QUEUE_NAMESPACE:-venom}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-}
      ALLOW_DATA_MUTATION: ${ALLOW_DATA_MUTATION:-0}
      VENOM_PAUSE_BACKGROUND_TASKS: ${VENOM_PAUSE_BACKGROUND_TASKS:-false}
      ENABLE_AUTO_DOCUMENTATION: ${ENABLE_AUTO_DOCUMENTATION:-true}
      ENABLE_AUTO_GARDENING: ${ENABLE_AUTO_GARDENING:-true}
      # Local docker mesh policy:
      # keep internal service-to-service links on HTTP by default.
      URL_SCHEME_POLICY: ${URL_SCHEME_POLICY:-force_http}
      AI_MODE: ${AI_MODE:-LOCAL}
      ACTIVE_LLM_SERVER: ${ACTIVE_LLM_SERVER:-ollama}
      LLM_SERVICE_TYPE: ${LLM_SERVICE_TYPE:-local}
      LLM_LOCAL_ENDPOINT: ${LLM_LOCAL_ENDPOINT:-http://ollama:11434/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-${OLLAMA_MODEL:-gemma2:2b}}
      LLM_WARMUP_ON_STARTUP: ${LLM_WARMUP_ON_STARTUP:-false}
      VENOM_OLLAMA_PROFILE: ${VENOM_OLLAMA_PROFILE:-balanced-12-24gb}
      # Backend uses 0/empty as sentinel => resolve from VENOM_OLLAMA_PROFILE.
      # Container-level OLLAMA_* above tune the server defaults.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-0}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-0}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-0}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-}
      OLLAMA_RETRY_MAX_ATTEMPTS: ${OLLAMA_RETRY_MAX_ATTEMPTS:-2}
      OLLAMA_RETRY_BACKOFF_SECONDS: ${OLLAMA_RETRY_BACKOFF_SECONDS:-0.35}
      SUMMARY_STRATEGY: heuristic_only
    depends_on:
      ollama:
        # Do not hard-block startup on healthcheck here.
        # Health is verified explicitly by installer/CI via HTTP checks.
        condition: service_started
        required: false
    ports:
      - "${VENOM_API_HOST_PORT:-8000}:8000"
    volumes:
      - venom-data:/app/data
      - venom-workspace:/app/workspace
      - venom-logs:/app/logs
    healthcheck:
      # Liveness check: keep it independent from optional subsystems.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: ${VENOM_CONTAINER_PREFIX:-venom}-frontend-minimal
    environment:
      NEXT_PUBLIC_ENV: ${ENV:-production}
      ENVIRONMENT_ROLE: ${ENVIRONMENT_ROLE:-dev}
      NEXT_PUBLIC_ENVIRONMENT_ROLE: ${ENVIRONMENT_ROLE:-dev}
      URL_SCHEME_POLICY: ${URL_SCHEME_POLICY:-force_http}
      NEXT_PUBLIC_URL_SCHEME_POLICY: ${URL_SCHEME_POLICY:-force_http}
      API_PROXY_TARGET: ${HTTP_SCHEME:-http}://backend:8000
      NEXT_PUBLIC_API_BASE: ""
      NEXT_PUBLIC_WS_BASE: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${VENOM_WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ollama-data:
  venom-data:
  venom-workspace:
  venom-logs:
