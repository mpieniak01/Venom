name: "Web Next Playwright E2E"

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Playwright profile to run"
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - functional
          - simulated
          - full
  pull_request:
    branches: [main]
    paths:
      - "web-next/**"
      - ".github/workflows/web-next-playwright-e2e.yml"
  push:
    branches: [main]
    paths:
      - "web-next/**"
      - ".github/workflows/web-next-playwright-e2e.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: web-next-playwright-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    name: Playwright E2E (${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_SIMULATED_SERVER: "1"
      E2E_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e/results-${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: "web-next/.nvmrc"
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Install dependencies
        run: npm --prefix web-next ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web-next/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm --prefix web-next exec playwright install chromium

      - name: Run E2E profile in an isolated network namespace
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          runner_home="$HOME"
          runner_path="$PATH"
          workspace="$GITHUB_WORKSPACE"
          sudo unshare --net --mount -- bash -c '
            set -euo pipefail
            workspace="$1"; runner_user="$2"; runner_home="$3"; runner_path="$4"; profile="$5"
            mount --make-rprivate /
            ip link set lo up
            if [ "$(readlink /proc/self/ns/net)" = "$(readlink /proc/1/ns/net)" ]; then
              echo "Network namespace isolation failed" >&2
              exit 1
            fi
            runner_uid="$(id -u "$runner_user")"
            for socket in /run/docker.sock /var/run/docker.sock /run/containerd/containerd.sock /run/dbus/system_bus_socket "/run/user/$runner_uid/bus"; do
              if [ -S "$socket" ]; then mount --bind /dev/null "$socket"; fi
            done
            cd "$workspace"
            run_profile() {
              runuser -u "$runner_user" -- env -i \
                HOME="$runner_home" USER="$runner_user" LOGNAME="$runner_user" \
                PATH="$runner_path" LANG=C.UTF-8 CI=true GITHUB_ACTIONS=true \
                RUNNER_ENVIRONMENT=github-hosted E2E_SIMULATED_SERVER=1 \
                NEXT_TELEMETRY_DISABLED=1 E2E_PROFILE="$profile" \
                PLAYWRIGHT_JSON_OUTPUT_NAME="$1" \
                npm --prefix web-next run "$2" "${@:3}"
            }
            case "$profile" in
              smoke) run_profile "test-results/e2e/results-smoke.json" test:e2e:smoke -- --reporter=json,line ;;
              functional) run_profile "test-results/e2e/results-functional.json" test:e2e:functional -- --reporter=json,line ;;
              simulated|full) run_profile "" test:e2e ;;
              *) echo "Unsupported E2E_PROFILE=$profile" >&2; exit 2 ;;
            esac
          ' bash "$workspace" "$runner_user" "$runner_home" "$runner_path" "$E2E_PROFILE"
      - name: Build flaky trend summary
        if: ${{ always() && (env.E2E_PROFILE == 'smoke' || env.E2E_PROFILE == 'functional') }}
        run: npm --prefix web-next run test:e2e:trend

      - name: Enforce quality thresholds (smoke/functional)
        if: ${{ success() && (env.E2E_PROFILE == 'smoke' || env.E2E_PROFILE == 'functional') }}
        run: |
          set -euo pipefail
          if [ "${E2E_PROFILE}" = "smoke" ]; then
            export E2E_MIN_TESTS=5
            export E2E_MAX_FLAKY_RATE=15
          else
            export E2E_MIN_TESTS=8
            export E2E_MAX_FLAKY_RATE=10
          fi
          npm --prefix web-next run test:e2e:quality-gate

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-${{ env.E2E_PROFILE }}
          path: |
            web-next/test-results/**
            web-next/playwright-report/**
          if-no-files-found: ignore
