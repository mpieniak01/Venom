# Automatic Analysis ignores sonar-project.properties; keep its CPD policy explicit.
# Translation dictionaries intentionally repeat keys and shapes between languages.
# CPD exclusions do not exclude these files from issue/security analysis.
sonar.cpd.exclusions=tests/**,web-next/tests/**,web-next/lib/i18n/locales/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14
