name: Security Delta Nightly

on:
  schedule:
    # Daily at 03:15 UTC
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: security-delta-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-delta-scan:
    name: Security delta scan (python + web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            requirements/locks/ci-linux-py314.txt
            requirements/locks/build-linux-py314.txt

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: "web-next/.nvmrc"
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Install Python deps for delta scan
        run: |
          python scripts/bootstrap_dependency_profile.py --profile ci --venv "$PWD/.venv" --update
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install web deps for production audit
        run: npm --prefix web-next ci

      - name: Run security delta scan
        run: make security-delta-scan

      - name: Upload security delta artifact
        uses: actions/upload-artifact@v6
        with:
          name: security-delta-latest
          path: logs/security-delta-latest.json
          if-no-files-found: error
